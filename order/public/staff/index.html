<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2B6BD3">
<title>小夜月 スタッフ</title>
<link rel="manifest" href="/staff/manifest.webmanifest">
<link rel="apple-touch-icon" href="/staff/icon-180.png">
<link rel="icon" href="/staff/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小夜月 スタッフ">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root { --bg:#EEF4FB; --surface:#FFFFFF; --line:#E2EBF5; --border:#C3D3E5; --text:#1D2A3B; --muted:#536479; --accent:#2B6BD3; --sel:#E3EEFC; --warn-bg:#FCEBD2; --warn:#7A4A0E; --red:#C0392B; --grad:linear-gradient(135deg,#2B6BD3 0%,#138A74 100%); --spring:cubic-bezier(.34,1.56,.64,1); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 14px; line-height: 1.5; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:disabled { opacity: .5; cursor: default; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 16px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 16px; flex-wrap: wrap; }
  .logo { font-family: 'Shippori Mincho B1', serif; font-size: 20px; letter-spacing: .12em; }
  .logo small { font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 12px; letter-spacing: 0; color: var(--muted); margin-left: 8px; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  section { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  h2 { font-size: 15px; margin: 0; display: flex; align-items: center; gap: 8px; }
  h2 .n { font-size: 12px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--accent); color: #fff; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px; }
  .item { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: #fff; }
  .item.new { border-color: var(--accent); box-shadow: 0 0 0 2px var(--sel); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .room { font-family: 'Shippori Mincho B1', serif; font-size: 20px; }
  .muted { color: var(--muted); font-size: 12px; }
  .lines { margin: 0; padding-left: 18px; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .b { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border); background: transparent; font-weight: 500; }
  .b.p { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .b.d { color: var(--red); border-color: #E3B8AE; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--sel); color: var(--accent); }
  .tag.w { background: var(--warn-bg); color: var(--warn); }
  form { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; align-items: end; }
  form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  form input { height: 44px; border-radius: 10px; border: 1px solid var(--border); padding: 0 10px; background: #fff; width: 100%; }
  form .b { grid-column: 1 / -1; }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  .login { max-width: 360px; margin: 18vh auto; display: flex; flex-direction: column; gap: 12px; padding: 0 16px; }
  .login input[type=checkbox] { width: 20px; height: 20px; }
  .login input { height: 52px; border-radius: 12px; border: 1px solid var(--border); padding: 0 14px; font-size: 18px; letter-spacing: .2em; }
  dialog { border: none; border-radius: 18px; padding: 24px; max-width: 420px; width: calc(100% - 32px); }
  dialog::backdrop { background: rgba(20,18,14,.45); }
  .qr { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .qr svg { width: 240px; height: 240px; }
  .qr .ttl { font-family: 'Shippori Mincho B1', serif; font-size: 22px; letter-spacing: .12em; }
  .qr .langs { font-size: 12px; color: var(--muted); line-height: 1.7; }
  .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 12px; z-index: 50; }
  @media (max-width: 520px) { form { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  /* チャット */
  .thread { width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; margin-bottom: 8px; }
  .thread .preview { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .badge { display: inline-flex; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--red); color: #fff; font-size: 12px; align-items: center; justify-content: center; }
  h2 .n.hot { background: var(--red); }
  dialog.chat-dlg { padding: 0; width: 100%; max-width: 640px; height: 100dvh; max-height: 100dvh; margin: 0 auto; border-radius: 0; display: flex; flex-direction: column; background: var(--bg); }
  dialog.chat-dlg:not([open]) { display: none; }
  dialog.menu-dlg { padding: 0; width: 100%; max-width: 720px; height: 100dvh; max-height: 100dvh; margin: 0 auto; border-radius: 0; display: flex; flex-direction: column; background: var(--bg); }
  dialog.menu-dlg:not([open]) { display: none; }
  .mbody { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  .mgroup { gap: 8px; }
  .mgroup h2 { display: flex; align-items: center; gap: 8px; }
  .mitem { flex-direction: row; align-items: center; gap: 12px; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .mitem .thumb { width: 64px; height: 64px; flex: none; border-radius: 10px; overflow: hidden; background: var(--sel); display: flex; align-items: center; justify-content: center; }
  .mitem .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .mitem .noimg { font-size: 10px; color: var(--muted); }
  .minfo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .mname { font-weight: 700; }
  .mprice { font-weight: 700; white-space: nowrap; }
  .medit { display: flex; text-align: left; align-items: stretch; }
  .medit > * { align-self: stretch; }
  .medit [hidden] { display: none !important; }
  .medit label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .medit input:not([type=checkbox]), .medit select, .medit textarea { height: 44px; border-radius: 10px; border: 1px solid var(--border); padding: 0 10px; background: #fff; width: 100%; font: inherit; font-size: 16px; color: var(--text); }
  .medit textarea { height: auto; padding: 10px; resize: vertical; }
  .medit .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .medit .chk { flex-direction: row; align-items: center; gap: 10px; font-size: 14px; color: var(--text); }
  .medit .chk input { width: 22px; height: 22px; }
  .medit h3 { margin: 6px 0 0; font-size: 14px; }
  .medit .b { grid-column: auto; }
  .trset { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; background: #fff; margin: 0; }
  .trset legend { font-size: 12px; font-weight: 700; padding: 0 4px; }
  .trset summary { font-size: 12px; font-weight: 700; cursor: pointer; padding: 4px 0; }
  .dfields { display: flex; flex-direction: column; gap: 14px; }
  .slug { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text); }
  .slug input { flex: 1; }
  .alg { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px 10px; }
  .alg .chk { font-size: 13px !important; }
  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .ph { display: flex; flex-direction: column; gap: 6px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
  .ph img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 8px; }
  .ph .tag { align-self: flex-start; }
  .addph { flex-direction: row !important; align-items: center; justify-content: center; min-height: 120px; border-style: dashed !important; color: var(--accent) !important; font-size: 14px !important; cursor: pointer; }
  .addph.busy { opacity: .6; pointer-events: none; }
  .mactions { display: flex; justify-content: space-between; gap: 10px; position: sticky; bottom: calc(-24px - env(safe-area-inset-bottom, 0px)); background: var(--bg); padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); margin-top: 6px; border-top: 1px solid var(--line); }
  .mactions .b.p { flex: 1; max-width: 240px; margin-left: auto; }
  .chat-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .chat-head .room { font-size: 18px; }
  dialog.chat-dlg .msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { display: flex; flex-direction: column; gap: 3px; max-width: 85%; }
  .msg.me { align-self: flex-end; align-items: flex-end; }
  .msg.them { align-self: flex-start; align-items: flex-start; }
  .bubble { padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .msg.me .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.them .bubble { background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .bubble .orig { display: block; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .msg .meta { font-size: 11px; color: var(--muted); }
  dialog.chat-dlg .composer { display: flex; gap: 8px; align-items: flex-end; padding: 10px 12px 4px; border-top: 1px solid var(--line); background: var(--surface); grid-template-columns: none; }
  dialog.chat-dlg .composer textarea { flex: 1; min-height: 48px; max-height: 160px; resize: vertical; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); font: inherit; font-size: 16px; background: #fff; }
  dialog.chat-dlg .note { margin: 0; padding: 4px 14px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--surface); }
  .howto h2 { margin-bottom: 8px; }
  .howto ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
  /* ---------- 青緑の見た目と動き ---------- */
  body { background: linear-gradient(180deg,#EAF2FD 0%,#EDF8F4 100%) fixed; }
  .wrap > header { background: var(--grad); color: #fff; margin: -16px -16px 16px; padding: 18px 16px 16px; border-radius: 0 0 26px 26px; box-shadow: 0 10px 26px rgba(43,107,211,.25); }
  .wrap > header .logo small { color: rgba(255,255,255,.9); }
  .wrap > header .b { border-color: rgba(255,255,255,.6); background: rgba(255,255,255,.18); color: #fff; }
  section { border-radius: 22px; border-color: transparent; box-shadow: 0 6px 20px rgba(43,107,211,.08); }
  .item { border-radius: 18px; }
  .b { border-radius: 14px; transition: transform .4s var(--spring); }
  .b:active, .thread:active { transform: scale(.93); transition-duration: .08s; }
  .b.p, h2 .n, .msg.me .bubble { background: var(--grad); border-color: transparent; }
  .b.p { box-shadow: 0 6px 14px rgba(43,107,211,.25); }
  .item.new { border-color: transparent; box-shadow: 0 0 0 2px #2B6BD3, 0 10px 24px rgba(43,107,211,.18); animation: slide-in .6s var(--spring) both, glow 2.4s ease-in-out .6s 3; }
  @keyframes slide-in { from { opacity: 0; transform: translateX(-24px) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes glow { 50% { box-shadow: 0 0 0 4px rgba(19,138,116,.55), 0 10px 28px rgba(19,138,116,.25); } }
  .tap-bloom { position: fixed; z-index: 100; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; pointer-events: none; background: radial-gradient(circle, rgba(43,107,211,.38) 0%, rgba(19,138,116,.22) 45%, rgba(19,138,116,0) 70%); animation: bloom .6s ease-out forwards; }
  @keyframes bloom { to { transform: scale(10); opacity: 0; } }
  .done-out { animation: done-out .45s cubic-bezier(.6,-.3,.7,1) forwards; }
  @keyframes done-out { to { opacity: 0; transform: translateX(60px) scale(.9); } }
  .login .b.p { height: 52px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  @media print { body * { visibility: hidden; } dialog[open], dialog[open] * { visibility: visible; } dialog[open] { position: fixed; inset: 0; max-width: none; width: 100%; } .noprint { display: none !important; } }
</style>
<script src="/staff/vendor/qrcode.js"></script>
<script type="module" src="/staff/staff.js"></script>
</head>
<body>
<div id="root"></div>
<dialog id="dlg"></dialog>
</body>
</html>
