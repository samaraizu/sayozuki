<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1218">
<title>小夜月 予約｜ログイン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
  /* 画面（../../src/Styles.html）と同じ色。青＝押せるもの、赤＝問題、ほかはグレー */
  :root { --bg: #0F1218; --panel: #181C25; --line: #262B37; --text: #ECE9E1; --muted: #A4A9B6; --accent: #7CC4FF; --on-accent: #0B1A2A; --red-soft: #FFB4B4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
  body { font-family: 'Zen Kaku Gothic New', system-ui, sans-serif; -webkit-text-size-adjust: 100%; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 24px 16px; }
  .card { width: 100%; max-width: 360px; padding: 32px 24px 28px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 20px; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .logo { font-family: 'Shippori Mincho', serif; font-size: 24px; font-weight: 700; letter-spacing: 0.08em; }
  .sub { font-size: 13px; color: var(--muted); }
  .msg { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); }
  .msg.bad { color: var(--red-soft); }
  .go { display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-size: 16px; font-weight: 700; text-decoration: none; }
  .go:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .note { margin: 0; font-size: 12px; line-height: 1.6; color: var(--muted); }
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7CC4FF" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
    <span class="logo">小夜月</span>
    <span class="sub">予約</span>
  </div>
  <p id="msg" class="msg" role="status">Googleのアカウントでログインして使う。</p>
  <a class="go" href="/api/auth/start">Googleでログイン</a>
  <p class="note">入れるのは、許可されたGoogleアカウントだけ。ログインは30日続く。</p>
</main>
<script>
  (function () {
    var e = new URLSearchParams(location.search).get('e');
    var text = {
      denied: ['このGoogleアカウントでは使えない。許可されたアカウントを選んでログインし直して', true],
      failed: ['ログインできなかった。もう一度試して', true],
      config: ['ログインの設定がまだ終わっていない（booking/worker/README.md の手順）', true],
      cancel: ['ログインをやめた', false],
      out: ['ログアウトした', false]
    }[e];
    if (!text) return;
    var el = document.getElementById('msg');
    el.textContent = text[0];
    if (text[1]) el.className = 'msg bad';
  })();
</script>
</body>
</html>
