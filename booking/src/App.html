<script>
(function () {
  'use strict';

  var DAYS = 28; // 4週間
  var STEP = 7;  // 前後の矢印は1週間ずつ
  var TAX_PER_NIGHT = 300; // 入湯税の目安（2026/4/1以降の予約）。正式な額は台帳側で計算
  var ARRIVALS = ['15:00', '16:00', '17:00', '18:00以降', '未定'];
  var PAYS = ['当日Square', 'あとで決める'];
  var CHANNEL_CLASS = { 'Airbnb': 'airbnb', '楽天': 'rakuten', '楽天トラベル': 'rakuten', '直販': 'direct' };

  var state = {
    board: null,
    view: 'cal',
    weekStart: '',
    form: null,
    saving: false,
    closing: '' // 見送りの理由を入れている問い合わせの受付番号
  };

  var $view = document.getElementById('view');
  var $detail = document.getElementById('detail');
  var $toast = document.getElementById('toast');

  // ---------- 小物 ----------

  // 文字はすべて textContent で入れる（ゲスト名はAirbnb由来の外部テキスト）
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'style') el.setAttribute('style', v);
        else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
        else if (k === 'value') el.value = v;
        else el.setAttribute(k, v === true ? '' : v);
      });
    }
    for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el) {
    for (var i = 1; i < arguments.length; i++) {
      var child = arguments[i];
      if (child === null || child === undefined || child === false) continue;
      if (Array.isArray(child)) { append.apply(null, [el].concat(child)); continue; }
      el.appendChild(typeof child === 'string' || typeof child === 'number' ? document.createTextNode(String(child)) : child);
    }
  }
  function svg(paths, size, color) {
    var ns = 'http://www.w3.org/2000/svg';
    var s = document.createElementNS(ns, 'svg');
    s.setAttribute('width', size || 20);
    s.setAttribute('height', size || 20);
    s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('fill', 'none');
    s.setAttribute('stroke', color || 'currentColor');
    s.setAttribute('stroke-width', '1.75');
    s.setAttribute('stroke-linecap', 'round');
    s.setAttribute('stroke-linejoin', 'round');
    s.setAttribute('aria-hidden', 'true');
    paths.forEach(function (d) {
      var p = document.createElementNS(ns, 'path');
      p.setAttribute('d', d);
      s.appendChild(p);
    });
    return s;
  }
  var ICON_WARN = ['M12 3l10 18H2z', 'M12 10v5', 'M12 18h.01'];
  var ICON_PREV = ['M15 18l-6-6 6-6'];
  var ICON_NEXT = ['M9 6l6 6-6 6'];
  var ICON_CLOSE = ['M6 6l12 12', 'M18 6L6 18'];

  function yen(n) { return n.toLocaleString('ja-JP') + '円'; }
  function md(iso) { var p = iso.split('-'); return (+p[1]) + '/' + (+p[2]); }
  function channelClass(b) { return CHANNEL_CLASS[b.channel] || 'direct'; }
  function displayName(b) { return String(b.name || '').trim() || 'Reserved'; }

  function toast(message, bad) {
    $toast.textContent = message;
    $toast.className = 'toast' + (bad ? ' bad' : '');
    $toast.hidden = false;
    clearTimeout(toast.t);
    toast.t = setTimeout(function () { $toast.hidden = true; }, bad ? 8000 : 5000);
  }

  function call(fn, arg) {
    return new Promise(function (resolve) {
      google.script.run
        .withSuccessHandler(function (res) { resolve(res || { ok: false, message: '返事がなかった' }); })
        .withFailureHandler(function (err) { resolve({ ok: false, message: '通信できなかった（' + (err && err.message ? err.message : err) + '）' }); })[fn](arg);
    });
  }

  // ---------- 画面の切り替え ----------

  function go(view) {
    state.view = view;
    document.querySelectorAll('[data-view]').forEach(function (a) {
      if (a.getAttribute('data-view') === view) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
    render();
    window.scrollTo(0, 0);
  }

  document.querySelectorAll('[data-view]').forEach(function (a) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      var v = a.getAttribute('data-view');
      if (v === 'new') openForm({});
      else go(v);
    });
  });

  function render() {
    $view.textContent = '';
    if (!state.board) { append($view, h('p', { class: 'loading' }, '読み込み中…')); return; }
    if (state.view === 'new') renderForm();
    else if (state.view === 'inbox') renderInbox();
    else renderCalendar();
  }

  function load() {
    return call('getBoard').then(function (res) {
      if (!res.ok) {
        $view.textContent = '';
        append($view, h('p', { class: 'fail' }, res.message),
          h('p', { class: 'loading' }, h('button', { type: 'button', class: 'pill', onclick: load }, 'もう一度読み込む')));
        return;
      }
      state.board = res;
      if (!state.board.inquiries) state.board.inquiries = [];
      if (!state.weekStart) state.weekStart = res.today;
      updateBadges();
      render();
    });
  }

  function updateBadges() {
    var n = state.board ? state.board.inquiries.length : 0;
    document.querySelectorAll('[data-inbox-count]').forEach(function (el) {
      el.textContent = n > 99 ? '99+' : String(n);
      el.hidden = n === 0;
      el.setAttribute('aria-label', '未対応 ' + n + '件');
    });
  }

  // ---------- 4週間カレンダー ----------

  function renderCalendar() {
    var b = state.board;
    var start = state.weekStart;
    var end = Lib.addDays(start, DAYS - 1);

    append($view, h('div', { class: 'cal-head' },
      h('h1', null, Lib.shortLabel(start) + ' 〜 ' + Lib.shortLabel(end)),
      h('div', { class: 'pager' },
        h('button', { type: 'button', class: 'icon-btn', 'aria-label': '前の週', onclick: function () { shiftWeek(-STEP); } }, svg(ICON_PREV)),
        h('button', { type: 'button', class: 'pill', onclick: function () { state.weekStart = b.today; render(); } }, '今日'),
        h('button', { type: 'button', class: 'icon-btn', 'aria-label': '次の週', onclick: function () { shiftWeek(STEP); } }, svg(ICON_NEXT))
      )
    ));

    // ダブルブッキング（今日以降に泊まりがかかるもの）
    Lib.findConflicts(b.bookings)
      .filter(function (c) { return c.a.checkOut > b.today && c.b.checkOut > b.today; })
      .forEach(function (c) {
        append($view, h('button', {
          type: 'button', class: 'alert',
          onclick: function () { state.weekStart = c.first < b.today ? b.today : c.first; render(); }
        },
          svg(ICON_WARN, 22, '#FF8A8A'),
          h('span', { class: 'grow' },
            h('strong', null, c.room + ' ' + md(c.first) + ' に2件入ってる'),
            h('span', { class: 's' }, (c.a.channel || '?') + ' と ' + (c.b.channel || '?') + ' が重なってる')
          ),
          svg(ICON_NEXT, 18, '#FFC2C2')
        ));
      });

    if (b.inquiries.length) {
      append($view, h('button', { type: 'button', class: 'alert inbox-alert', onclick: function () { go('inbox'); } },
        h('span', { class: 'grow' },
          h('strong', null, 'HPからの問い合わせ ' + b.inquiries.length + '件'),
          h('span', { class: 's' }, '空室を見て、予約にするか見送る')
        ),
        svg(ICON_NEXT, 18, '#B9E0FF')
      ));
    }

    var needCount = b.bookings.filter(function (x) { return Lib.isActive(x) && x.checkOut > b.today && Lib.needsInput(x); }).length;
    append($view, h('div', { class: 'status' },
      h('span', null, h('span', { class: 'dot', 'aria-hidden': 'true' }), 'Airbnb取り込み ' + (b.lastImport || '—')),
      needCount ? h('span', { class: 'need' }, '要入力 ' + needCount + '件') : null
    ));
    append($view, h('div', { class: 'legend' },
      h('span', null, h('i', { class: 'sw airbnb' }), 'Airbnb'),
      h('span', null, h('i', { class: 'sw rakuten' }), '楽天'),
      h('span', null, h('i', { class: 'sw direct' }), '直販'),
      h('span', null, h('i', { class: 'sw prep' }), '準備中・停止')
    ));

    var grid = h('div', { class: 'grid', role: 'table', 'aria-label': '部屋ごとの予約', style: '--cols: ' + DAYS });
    var days = h('div', { class: 'grow-row days', role: 'row' }, h('div', { class: 'corner', role: 'columnheader' }, '部屋'));
    for (var d = 0; d < DAYS; d++) {
      var iso = Lib.addDays(start, d);
      var wd = Lib.weekday(iso);
      var p = iso.split('-');
      var cls = 'day' + (wd === '月' && d > 0 ? ' wk' : '') + (wd === '土' ? ' sat' : wd === '日' ? ' sun' : '') + (iso === b.today ? ' today' : '');
      append(days, h('div', { class: cls, role: 'columnheader' },
        h('span', { class: 'wd' }, wd),
        h('span', { class: 'dn' }, (+p[2] === 1 || d === 0) ? (+p[1]) + '/' + (+p[2]) : String(+p[2]))
      ));
    }
    append(grid, days);

    Lib.layoutWeek(b.rooms, b.bookings, start, DAYS).forEach(function (row) {
      append(grid, roomRow(row, start));
    });
    append($view, h('div', { class: 'grid-scroll' }, grid));

    renderTodayCards();
  }

  function shiftWeek(n) {
    state.weekStart = Lib.addDays(state.weekStart, n);
    render();
  }

  function roomRow(row, start) {
    var b = state.board;
    var r = row.room;
    var sellable = r.state === Lib.SELLABLE;
    var lanes = row.lanes;
    var hasClash = row.clashDays.some(Boolean);
    var el = h('div', {
      class: 'grow-row' + (sellable ? '' : ' off'), role: 'row',
      style: 'grid-template-rows: repeat(' + lanes + ', ' + (lanes > 1 ? 50 : 58) + 'px)'
    });

    // 売っていない部屋は細い1行に畳む
    if (!sellable && row.bars.length === 0) {
      el.style.gridTemplateRows = '40px';
      append(el,
        h('div', { class: 'roomcell', role: 'rowheader', style: 'padding-top: 0; justify-content: center' }, h('span', { class: 'rn' }, r.name)),
        h('div', { class: 'prep' }, r.state + '・定員' + r.capacity));
      return el;
    }

    append(el, h('div', { class: 'roomcell', role: 'rowheader', style: 'grid-row: 1 / span ' + lanes },
      h('span', { class: 'rn' }, r.name),
      h('span', { class: 'rc' }, '定員' + r.capacity),
      hasClash ? h('span', { class: 'rx' }, '重複あり') : null
    ));

    for (var d = 0; d < DAYS; d++) {
      (function (d) {
        var iso = Lib.addDays(start, d);
        var cls = 'slot' + (Lib.weekday(iso) === '月' && d > 0 ? ' wk' : '') + (iso === b.today ? ' today' : '') + (row.clashDays[d] ? ' clash' : '');
        var attrs = { class: cls, style: 'grid-row: 1 / span ' + lanes + '; grid-column: ' + (d + 2) };
        if (sellable && iso >= b.today && !row.clashDays[d]) {
          attrs.type = 'button';
          attrs['aria-label'] = r.name + ' ' + md(iso) + ' に予約を入れる';
          attrs.onclick = function () { openForm({ checkIn: iso, checkOut: Lib.addDays(iso, 1), room: r.name }); };
          append(el, h('button', attrs));
        } else {
          attrs.class += ' static';
          attrs.style += '; cursor: default';
          append(el, h('div', attrs));
        }
      })(d);
    }

    row.bars.forEach(function (bar) {
      var bk = bar.booking;
      var n = Lib.people(bk);
      var nights = Lib.nightsBetween(bk.checkIn, bk.checkOut);
      var need = Lib.needsInput(bk);
      var tight = Lib.isTight(n, nights);
      var subText = need ? '要入力'
        : (bk.channel === '直販' ? '直販・' : '') + n + '名' + (nights >= 2 ? '・' + nights + '泊' : '');
      append(el, h('button', {
        type: 'button',
        class: 'bar ' + channelClass(bk) + (need ? ' need-input' : '') + (bar.clipStart ? ' clip-s' : '') + (bar.clipEnd ? ' clip-e' : ''),
        style: 'grid-row: ' + (bar.lane + 1) + '; grid-column: ' + (bar.col + 2) + ' / span ' + bar.span + (lanes > 1 ? '; height: 40px' : ''),
        'aria-label': displayName(bk) + '、' + (bk.channel || '') + '、' + md(bk.checkIn) + '〜' + md(bk.checkOut) + (need ? '、要入力' : ''),
        onclick: function () { openDetail(bk); }
      },
        h('span', { class: 'bn' }, displayName(bk)),
        h('span', { class: 'bs' }, tight && !need ? svg(['M12 3l10 18H2z'], 10) : null, subText)
      ));
    });
    return el;
  }

  function renderTodayCards() {
    var b = state.board;
    var active = b.bookings.filter(Lib.isActive);
    var ins = active.filter(function (x) { return x.checkIn === b.today; });
    var outs = active.filter(function (x) { return x.checkOut === b.today; });
    function card(label, list, meta) {
      return h('div', { class: 'card' },
        h('span', { class: 'k' }, label),
        list.length === 0 ? h('span', { class: 'm' }, 'なし') : list.map(function (x) {
          return h('button', { type: 'button', onclick: function () { openDetail(x); } },
            h('span', { class: 'v', style: 'display:block' }, x.room + ' ' + displayName(x)),
            h('span', { class: 'm', style: 'display:block' }, meta(x)));
        }));
    }
    append($view, h('section', { class: 'todaycards', 'aria-label': '今日' },
      card('今日のチェックイン', ins, function (x) { return (x.arrival || '到着未定') + '・' + Lib.people(x) + '名'; }),
      card('今日のチェックアウト', outs, function (x) { return (x.channel || '') + '・' + Lib.people(x) + '名'; })
    ));
  }

  // ---------- HPからの問い合わせ ----------

  var LANG_LABEL = { ja: '日本語', en: '英語', zh: '中国語', vi: 'ベトナム語', th: 'タイ語', ko: '韓国語' };

  // 希望の日程で入れそうかの目安。保存のときにサーバーでもう一度確かめる
  function inquiryFit(q) {
    var b = state.board;
    var f = Lib.inquiryToForm(q, b.rooms, b.today);
    if (!f.checkIn) return { cls: 'unk', text: q.checkIn ? '到着日が過ぎてる' : '到着日の指定なし' };
    var avail = Lib.roomAvailability(b.rooms, b.bookings, f.checkIn, f.checkOut, f.people);
    var free = avail.filter(function (a) { return a.available; });
    if (f.room) {
      var mine = avail.filter(function (a) { return a.name === f.room; })[0];
      if (mine && mine.available) return { cls: 'ok', text: '希望の' + f.room + 'が空いてる' };
      return free.length
        ? { cls: 'unk', text: '希望の' + f.room + 'は' + (mine ? mine.status : '不明') + '。ほかに空き' + free.length + '室' }
        : { cls: 'ng', text: 'この日程は空きなし' };
    }
    return free.length ? { cls: 'ok', text: '空き' + free.length + '室' } : { cls: 'ng', text: 'この日程は空きなし' };
  }

  function renderInbox() {
    var b = state.board;
    var wrap = h('div', { class: 'inbox' },
      h('div', null,
        h('h1', null, '問い合わせ'),
        h('p', { class: 'lead' }, 'HPのご予約フォームから届いた未対応のもの。返事はメールで。予約にすると台帳に直販で入り、ここから消える')));
    if (!b.inquiries.length) {
      append(wrap, h('p', { class: 'empty' }, '未対応の問い合わせはない'));
      append($view, wrap);
      return;
    }
    b.inquiries.forEach(function (q) { append(wrap, inquiryCard(q)); });
    append($view, wrap);
  }

  function inquiryCard(q) {
    var fit = inquiryFit(q);
    var dates = q.checkIn
      ? Lib.shortLabel(q.checkIn) + ' から ' + (q.nights || 1) + '泊'
      : '未定';
    var rows = [
      ['日程', dates],
      ['人数', (q.guests || '—') + '名'],
      ['希望の部屋', q.room || '指定なし'],
      ['食事', q.meal || '未選択'],
      ['メール', q.email ? h('a', { href: 'mailto:' + q.email }, q.email) : '—'],
      ['電話', q.tel ? h('a', { href: 'tel:' + q.tel.replace(/[^0-9+]/g, '') }, q.tel) : '—']
    ];
    var closing = state.closing === q.id;
    var reason = null;
    var card = h('article', { class: 'qcard', 'aria-labelledby': 'q-' + q.id },
      h('div', { class: 'qhead' },
        h('h2', { id: 'q-' + q.id }, q.name || '（名前なし）'),
        q.lang && q.lang !== 'ja' ? h('span', { class: 'chip lang' }, LANG_LABEL[q.lang] || q.lang) : null,
        h('span', { class: 'when' }, q.receivedAt + ' 受付')
      ),
      h('span', { class: 'qfit ' + fit.cls }, fit.text),
      h('dl', null, rows.map(function (r) { return [h('dt', null, r[0]), h('dd', null, r[1])]; })),
      q.message ? h('p', { class: 'qmsg' }, q.message) : null,
      h('div', { class: 'qactions' },
        h('button', { type: 'button', class: 'save', onclick: function () { openForm(Lib.inquiryToForm(q, state.board.rooms, state.board.today)); } }, '予約にする'),
        h('button', { type: 'button', class: 'ghost', 'aria-expanded': closing ? 'true' : 'false', onclick: function () { state.closing = closing ? '' : q.id; render(); } }, '見送り')
      ),
      closing ? h('div', { class: 'qclose' },
        reason = h('input', { class: 'input', type: 'text', maxlength: '200', placeholder: '理由（任意）満室、連絡がつかない など', 'aria-label': '見送る理由' }),
        h('button', { type: 'button', class: 'ghost danger', onclick: function (e) { closeInquiry(q, reason.value, e.currentTarget); } }, '見送る')
      ) : null
    );
    if (closing) setTimeout(function () { reason.focus(); }, 0);
    return card;
  }

  function closeInquiry(q, reason, btn) {
    btn.disabled = true;
    call('closeInquiry', { id: q.id, reason: reason }).then(function (res) {
      if (!res.ok) { btn.disabled = false; toast(res.message, true); return; }
      state.closing = '';
      toast(q.name + ' の問い合わせを見送りにした');
      load();
    });
  }

  // ---------- 予約の中身（第1段は見るだけ） ----------

  function openDetail(b) {
    var nights = Lib.nightsBetween(b.checkIn, b.checkOut);
    var rows = [
      ['ステータス', b.status || '—'],
      ['部屋', b.room],
      ['日程', Lib.shortLabel(b.checkIn) + ' → ' + Lib.shortLabel(b.checkOut) + '・' + nights + '泊'],
      ['人数', '大人' + Lib.toInt(b.adults) + (Lib.toInt(b.children) ? '・子ども' + Lib.toInt(b.children) : '') + (Lib.toInt(b.infants) ? '・乳幼児' + Lib.toInt(b.infants) : '')],
      ['連絡先', b.contact || '—'],
      ['到着予定', b.arrival || '—'],
      ['食事', b.meals || '素泊まり'],
      ['支払額', b.guestPaid || '—'],
      ['支払い状況', b.payment || '—'],
      ['入湯税', (b.tax || '—') + (b.taxCollected ? '（' + b.taxCollected + '）' : '')],
      ['予約番号', b.no || '—'],
      ['メモ', b.memo || '—']
    ];
    if (b.flag) rows.unshift(['要確認', b.flag]);
    $detail.textContent = '';
    append($detail,
      h('div', { class: 'dh' },
        h('span', { class: 'chip ' + channelClass(b) }, b.channel || '—'),
        h('h2', { id: 'detail-title' }, displayName(b)),
        h('button', { type: 'button', class: 'icon-btn', 'aria-label': '閉じる', onclick: function () { $detail.close(); } }, svg(ICON_CLOSE))
      ),
      h('dl', null,
        rows.map(function (r) { return h('div', null, h('dt', null, r[0]), h('dd', null, r[1])); }),
        b.url ? h('div', null, h('dt', null, '媒体の画面'), h('dd', null, h('a', { href: b.url, target: '_blank', rel: 'noopener' }, '開く'))) : null
      ),
      mealBox(b),
      cancelBox(b)
    );
    if ($detail.showModal) $detail.showModal(); else $detail.setAttribute('open', '');
  }

  // ---------- 食事（あとから手で入れる） ----------
  // Airbnb には食事の申込欄がないので、予約が入った時点でメッセージで聞き、その答えをここに入れる。
  // HP・ほかのサイトは申込のときにお客様が選んでいるので、直すときだけ使う。当日言われても用意できないので、お客様が自分で足す入口は無い
  var MENU_URL = 'https://order.sayozuki.com/menu'; // 料理の写真と内容（客室オーダーの紹介ページ）
  var MEAL_DEADLINE_DAYS = 3; // 何日前までに答えてもらうか（仕入れと仕込みの都合）

  function hearingText(b, lang) {
    var due = Lib.addDays(b.checkIn, -MEAL_DEADLINE_DAYS);
    var hasDue = due >= state.board.today;
    var name = displayName(b) === 'Reserved' ? '' : displayName(b);
    if (lang === 'ja') {
      return (name ? name + '様\n\n' : '') +
        'ご予約ありがとうございます。小夜月です。\n' +
        '当館では、お部屋で夕食・朝食をお召し上がりいただけます（事前予約制）。仕込みの都合で当日のお申し込みはお受けできないため、' +
        (hasDue ? md(due) + 'までに' : 'お早めに') + '、ご希望の有無と人数をこのメッセージでお知らせください。\n\n' +
        '料理の写真と内容：' + MENU_URL + '?lang=ja\n\n' +
        '例）「夕食2名・朝食2名」「朝食だけ2名」「食事はなし」';
    }
    return (name ? 'Hi ' + name + ',\n\n' : '') +
      'Thank you for booking Sayozuki. We can serve dinner and breakfast in your room, but they must be booked in advance — we cannot prepare them on the day. ' +
      'Please reply to this message ' + (hasDue ? 'by ' + md(due) : 'as soon as you can') + ' to let us know whether you would like them, and for how many guests.\n\n' +
      'Photos and details of each dish: ' + MENU_URL + '?lang=en\n\n' +
      'e.g. "Dinner for 2, breakfast for 2", "Breakfast only for 2", or "No meals"';
  }

  function copyText(text, label) {
    var done = function () { toast(label + 'をコピーした。Airbnb のメッセージに貼って送って'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { window.prompt('コピーして', text); });
    } else {
      window.prompt('コピーして', text);
    }
  }

  function mealBox(b) {
    var today = state.board.today;
    var nights = Lib.nightsBetween(b.checkIn, b.checkOut);
    if (!b.no || b.status === Lib.CANCELLED || b.status === '仮' || nights < 1 || nights > 60 || b.checkOut < today) return null;
    var airbnb = b.channel === 'Airbnb';
    var saved = (state.board.mealPlans || []).filter(function (m) { return m.no === b.no; })[0];
    var ppl = Math.max(1, Lib.people(b));
    var plan = saved && Array.isArray(saved.plan) && saved.plan.length === nights
      ? Lib.cleanMealPlan(saved.plan, nights)
      : Lib.mealPlanFrom(b.meals, nights, ppl);
    var note = saved ? saved.note : '';
    var open = false, saving = false;
    var box = h('div', { class: 'cancelbox mealbox' });

    function setAll(dinner, breakfast) {
      plan = plan.map(function () { return { dinner: dinner, breakfast: breakfast }; });
      draw();
    }
    function counter(k, key, label) {
      var v = plan[k][key];
      return h('div', { class: 'mcount' },
        h('span', { class: 'ml' }, label),
        h('div', { class: 'stepper mini', role: 'group', 'aria-label': label },
          h('button', { type: 'button', 'aria-label': label + 'を1人減らす', disabled: v <= 0, onclick: function () { plan[k][key] = v - 1; draw(); } }, '−'),
          h('output', null, v + '名'),
          h('button', { type: 'button', 'aria-label': label + 'を1人増やす', disabled: v >= Lib.MEAL_MAX, onclick: function () { plan[k][key] = v + 1; draw(); } }, '＋')));
    }
    function save(btn) {
      if (saving) return;
      saving = true;
      btn.disabled = true;
      call('setMeals', { no: b.no, plan: plan, note: note }).then(function (res) {
        saving = false;
        if (!res.ok) { btn.disabled = false; toast(res.message, true); return; }
        $detail.close();
        toast(displayName(b) + ' の食事を「' + res.meals + '」にした。台帳には5分以内に反映');
        load();
      });
    }

    function draw() {
      box.textContent = '';
      var current = b.meals || (airbnb ? '未確認' : '素泊まり');
      append(box,
        h('h3', null, '食事'),
        h('p', { class: 'mnow' + (airbnb && !b.meals ? ' missing' : '') }, current),
        airbnb ? h('p', { class: 'pn' }, 'Airbnbは食事の申込欄がない。予約が入ったら下の文面をメッセージで送って聞き、答えをここに入れる。当日の申し込みは受けない') : null,
        airbnb ? h('div', { class: 'qactions' },
          h('button', { type: 'button', class: 'ghost', onclick: function () { copyText(hearingText(b, 'ja'), '聞く文面（日本語）'); } }, '聞く文面をコピー（日本語）'),
          h('button', { type: 'button', class: 'ghost', onclick: function () { copyText(hearingText(b, 'en'), '聞く文面（英語）'); } }, 'English')) : null
      );
      if (!open) {
        append(box, h('div', { class: 'qactions' },
          h('button', { type: 'button', class: 'save', onclick: function () { open = true; draw(); } }, b.meals ? '食事を直す' : '食事を入れる')));
        return;
      }
      var rows = plan.map(function (_, k) {
        return h('div', { class: 'mnight' },
          h('span', { class: 'mn' }, nights > 1 ? (k + 1) + '泊目' : ''),
          counter(k, 'dinner', '夕食 ' + Lib.shortLabel(Lib.addDays(b.checkIn, k))),
          counter(k, 'breakfast', '朝食 ' + Lib.shortLabel(Lib.addDays(b.checkIn, k + 1))));
      });
      var preview = h('p', { class: 'mpreview' }, '台帳に入る内容：' + Lib.mealText(b.checkIn, plan, note));
      append(box,
        h('div', { class: 'segs' },
          h('button', { type: 'button', class: 'seg', onclick: function () { setAll(ppl, ppl); } }, '全泊 夕朝 ' + ppl + '名'),
          h('button', { type: 'button', class: 'seg', onclick: function () { setAll(0, ppl); } }, '朝食だけ'),
          h('button', { type: 'button', class: 'seg', onclick: function () { setAll(0, 0); } }, 'なし')),
        rows,
        h('label', { class: 'field' }, '料理・時間・アレルギー（任意。台帳の食事に括弧で入る）',
          h('input', { class: 'input', type: 'text', maxlength: '100', value: note, placeholder: 'すき焼き、朝8:00、えびアレルギー など',
            oninput: function (e) { note = e.target.value; preview.textContent = '台帳に入る内容：' + Lib.mealText(b.checkIn, plan, note); } })),
        preview,
        h('div', { class: 'qactions' },
          h('button', { type: 'button', class: 'ghost', onclick: function () { open = false; draw(); } }, 'やめる'),
          h('button', { type: 'button', class: 'save', onclick: function (e) { save(e.currentTarget); } }, 'この内容で入れる')),
        h('p', { class: 'pn' }, '夕食はその日の夜、朝食はその翌朝。台帳の「食事」列には5分以内に反映')
      );
    }
    draw();
    return box;
  }

  // ---------- キャンセル（直販だけ） ----------

  function yenText(n) { return Lib.toInt(n).toLocaleString('ja-JP') + '円'; }

  // キャンセル規定のメモ。今日キャンセルしたときに当たる行を強調する
  function policyMemo(current) {
    return h('div', { class: 'policy' },
      h('p', { class: 'ph' }, 'キャンセル規定（直販・HP予約）'),
      h('ul', null, Lib.CANCEL_POLICY.map(function (p) {
        return h('li', { class: current && current.label === p.label ? 'on' : '' },
          h('span', null, p.label), h('span', null, p.rate === 0 ? '無料' : '支払額の' + p.rate + '%'));
      })),
      h('p', { class: 'pn' }, '日数はご到着日の何日前か。HPで前払いの予約は、返金額を Square から自動で返す。現地払い・未収の予約は返金なし（キャンセル料を請求するかは宿の判断）')
    );
  }

  function cancelBox(b) {
    var today = state.board.today;
    if (b.channel !== '直販') {
      return h('div', { class: 'cancelbox' }, h('p', { class: 'pn' }, (b.channel || '媒体') + 'の予約は、そのサイトでキャンセルする（メールの取り込みで台帳もキャンセルになる）'));
    }
    if (b.status === 'キャンセル') return h('div', { class: 'cancelbox' }, policyMemo(null), h('p', { class: 'pn' }, 'キャンセル済み'));
    if (b.status === '仮') return h('div', { class: 'cancelbox' }, policyMemo(null), h('p', { class: 'pn' }, 'HPの決済待ち。30分払われなければ自動で取り消される'));
    if (b.checkOut && b.checkOut < today) return h('div', { class: 'cancelbox' }, policyMemo(null));

    var policy = Lib.cancelPolicy(b.checkIn, today);
    var prepaid = b.payment === 'HPで決済済';
    var amt = Lib.cancelAmounts(b.guestPaid, policy.rate);
    var refundInput = null, reasonInput = null, actions = null, confirming = false;

    function render() {
      actions.textContent = '';
      var refund = prepaid ? Lib.toInt(refundInput.value) : 0;
      if (!confirming) {
        append(actions, h('button', { type: 'button', class: 'ghost danger', onclick: function () { confirming = true; render(); } }, 'キャンセルする'));
      } else {
        append(actions,
          h('button', { type: 'button', class: 'ghost', onclick: function () { confirming = false; render(); } }, 'やめる'),
          h('button', { type: 'button', class: 'save danger-fill', onclick: function (e) { doCancel(e.currentTarget, refund); } },
            prepaid ? '本当にキャンセルして ' + yenText(refund) + ' 返金' : '本当にキャンセルする'));
      }
    }

    function doCancel(btn, refund) {
      btn.disabled = true;
      call('cancelBooking', { no: b.no, refund: prepaid ? refund : undefined, reason: reasonInput.value }).then(function (res) {
        if (!res.ok) { btn.disabled = false; toast(res.message, true); return; }
        $detail.close();
        toast(displayName(b) + ' をキャンセルにした' + (res.refund ? '（' + yenText(res.refund) + ' 返金）' : '') + '。台帳には5分以内に反映');
        load();
      });
    }

    var box = h('div', { class: 'cancelbox' },
      h('h3', null, 'キャンセル'),
      policyMemo(policy),
      h('dl', { class: 'calc' },
        h('div', null, h('dt', null, 'ご到着まで'), h('dd', null, policy.daysBefore > 0 ? 'あと' + policy.daysBefore + '日' : policy.daysBefore === 0 ? '今日' : '過ぎている')),
        h('div', null, h('dt', null, 'キャンセル料'), h('dd', null, policy.rate + '%（' + yenText(amt.fee) + '）')),
        h('div', null, h('dt', null, '支払額'), h('dd', null, amt.paid ? yenText(amt.paid) + (prepaid ? '（HPで前払い）' : '（' + (b.payment || '未収') + '）') : '—'))
      ),
      prepaid ? h('label', { class: 'field' }, '返金する額（規定どおりなら ' + yenText(amt.refund) + '）',
        refundInput = h('input', { class: 'input', type: 'number', inputmode: 'numeric', min: '0', max: String(amt.paid), value: String(amt.refund),
          oninput: function () { confirming = false; render(); } })) : null,
      h('label', { class: 'field' }, '理由（任意。台帳のメモに残る）',
        reasonInput = h('input', { class: 'input', type: 'text', maxlength: '200', placeholder: 'お客様からの電話 など' })),
      h('p', { class: 'pn' }, prepaid ? '返金は Square から。台帳のステータスは5分以内に「キャンセル」になる' : '返金はない。台帳のステータスは5分以内に「キャンセル」になる'),
      actions = h('div', { class: 'qactions' })
    );
    render();
    return box;
  }
  $detail.addEventListener('click', function (e) { if (e.target === $detail) $detail.close(); });

  // ---------- 手動入力 ----------

  function openForm(preset) {
    var today = state.board ? state.board.today : '';
    var inIso = preset.checkIn || today;
    var maxPeople = state.board ? Math.max.apply(null, state.board.rooms.map(function (r) { return r.capacity; }).concat([1])) : 99;
    state.form = {
      inquiryId: preset.inquiryId || '',
      checkIn: inIso,
      checkOut: preset.checkOut || (inIso ? Lib.addDays(inIso, 1) : ''),
      people: Math.min(preset.people || 2, maxPeople),
      room: preset.room || '',
      name: preset.name || '', contact: preset.contact || '', arrival: '16:00',
      price: '', payment: '当日Square',
      breakfast: !!preset.breakfast, dinner: !!preset.dinner, memo: preset.memo || ''
    };
    go('new');
  }

  function renderForm() {
    if (!state.form) { openForm({}); return; }
    var f = state.form;
    var maxPeople = Math.max.apply(null, state.board.rooms.map(function (r) { return r.capacity; }).concat([1]));
    var refs = {};

    function set(key, value) { f[key] = value; update(); }

    var main = h('div', { class: 'form-main' },
      f.inquiryId ? h('p', { class: 'from-inq' }, 'HPの問い合わせ ' + f.inquiryId + ' から。保存すると問い合わせは「予約済み」になる。お客様への返事はメールで') : null,
      step(1, 'Dates', null,
        h('div', { class: 'row' },
          h('div', { class: 'field' },
            h('label', { for: 'f-in' }, 'Check-in'),
            h('input', { id: 'f-in', class: 'input', type: 'date', value: f.checkIn, min: state.board.today, oninput: function (e) { set('checkIn', e.target.value); } })),
          h('div', { class: 'field' },
            h('label', { for: 'f-out' }, 'Check-out'),
            h('input', { id: 'f-out', class: 'input', type: 'date', value: f.checkOut, min: state.board.today, oninput: function (e) { set('checkOut', e.target.value); } })),
          h('div', { class: 'field', style: 'flex: 0 0 auto' },
            h('span', { class: 'lbl', id: 'f-ppl' }, '人数'),
            h('div', { class: 'stepper', role: 'group', 'aria-labelledby': 'f-ppl' },
              refs.dec = h('button', { type: 'button', 'aria-label': '1人減らす', onclick: function () { set('people', Math.max(1, f.people - 1)); } }, '−'),
              refs.ppl = h('output', { 'aria-live': 'polite' }),
              refs.inc = h('button', { type: 'button', 'aria-label': '1人増やす', onclick: function () { set('people', Math.min(maxPeople, f.people + 1)); } }, '＋')
            ))
        ),
        refs.nights = h('p', { class: 'note' })
      ),
      step(2, 'Room', null,
        refs.rooms = h('div', { class: 'rooms' }),
        refs.tight = h('div', { class: 'warnbox', hidden: true },
          svg(ICON_WARN, 18, '#7CC4FF'),
          h('span', null, '2名以上で2泊以上。この部屋だと窮屈になりやすい（予約は止めない）'))
      ),
      step(3, 'Guest', null,
        h('div', { class: 'row' },
          h('div', { class: 'field', style: 'flex-basis: 240px' },
            h('label', { for: 'f-name' }, 'ゲスト名'),
            h('input', { id: 'f-name', class: 'input', type: 'text', autocomplete: 'off', maxlength: '100', placeholder: '山田 花子', value: f.name, oninput: function (e) { set('name', e.target.value); } })),
          h('div', { class: 'field', style: 'flex-basis: 240px' },
            h('label', { for: 'f-tel' }, '連絡先'),
            h('input', { id: 'f-tel', class: 'input', type: 'text', autocomplete: 'off', maxlength: '200', placeholder: '090-0000-0000 か メール', value: f.contact, oninput: function (e) { set('contact', e.target.value); } }))
        ),
        h('fieldset', null, h('legend', null, '到着の予定'), refs.arrivals = h('div', { class: 'segs' }))
      ),
      step(4, '料金と支払い', null,
        h('div', { class: 'row' },
          h('div', { class: 'field' },
            h('label', { for: 'f-price' }, '1泊の料金（1室）'),
            h('input', { id: 'f-price', class: 'input', type: 'text', inputmode: 'numeric', autocomplete: 'off', placeholder: '例 18000', value: f.price, oninput: function (e) { set('price', e.target.value); } })),
          h('fieldset', { class: 'field', style: 'flex-basis: 280px' }, h('legend', null, '支払い'), refs.pays = h('div', { class: 'segs' }))
        ),
        h('div', { class: 'totals' },
          h('div', { class: 'total' }, h('span', { class: 'k' }, '宿泊料（自動）'), refs.stay = h('span', { class: 'v' })),
          h('div', { class: 'total' }, h('span', { class: 'k' }, '入湯税の目安（別・台帳で自動計算）'), refs.tax = h('span', { class: 'v' }))
        ),
        refs.meals = h('div', { class: 'meals' })
      ),
      h('div', { class: 'field' },
        h('label', { for: 'f-memo' }, 'メモ'),
        h('textarea', { id: 'f-memo', class: 'input', rows: '3', maxlength: '1000', placeholder: '記念日、到着が遅れそう、紹介してくれた人、など', oninput: function (e) { f.memo = e.target.value; } }, f.memo))
    );

    var side = h('aside', { class: 'form-side', 'aria-labelledby': 'sum-h' },
      h('section', { class: 'summary' }, h('h2', { id: 'sum-h' }, '入力内容'), refs.summary = h('dl')),
      h('section', { class: 'savebox' },
        refs.left = h('p', { class: 'left' }),
        refs.save = h('button', { type: 'button', class: 'save', onclick: save }, 'この内容で予約を入れる'),
        h('p', null, '台帳の末尾に直販で1行足す。重複チェック・入湯税・Googleカレンダーへの反映は、台帳側で5分以内に動く。')
      )
    );

    append($view, h('div', { class: 'form-wrap' }, main, side));

    function update() {
      var inIso = Lib.toIso(f.checkIn), outIso = Lib.toIso(f.checkOut);
      var nights = Lib.nightsBetween(inIso, outIso);
      var okDates = nights > 0;

      refs.ppl.textContent = f.people + '名';
      refs.dec.disabled = f.people <= 1;
      refs.inc.disabled = f.people >= maxPeople;
      refs.nights.textContent = okDates
        ? Lib.shortLabel(inIso) + ' → ' + Lib.shortLabel(outIso) + '　' + nights + '泊'
        : (inIso && outIso ? 'チェックアウトがチェックインより前になってる' : '日付を入れて');
      refs.nights.className = 'note' + (okDates || !(inIso && outIso) ? '' : ' bad');

      var avail = Lib.roomAvailability(state.board.rooms, state.board.bookings, inIso, outIso, f.people);
      var picked = avail.some(function (a) { return a.name === f.room && a.available; }) ? f.room : '';
      refs.rooms.textContent = '';
      avail.forEach(function (a) {
        var on = picked === a.name;
        var color = on ? 'var(--accent)' : a.available ? 'var(--text)' : 'var(--faint)';
        append(refs.rooms, h('button', {
          type: 'button', class: 'rcard' + (a.state !== Lib.SELLABLE ? ' off' : ''),
          'aria-label': a.name + '、定員' + a.capacity + '、' + (on ? '選択中' : a.status) + (a.why ? '、' + a.why : ''),
          disabled: !a.available, 'aria-pressed': on ? 'true' : 'false',
          onclick: function () { set('room', a.name); }
        },
          h('span', { class: 'top-line' }, h('span', { class: 'rid' }, a.name), h('span', { class: 'cap' }, '定員' + a.capacity)),
          h('span', { class: 'st', style: 'color: ' + color }, on ? '選択中' : a.status),
          a.why ? h('span', { class: 'why' }, a.why) : null
        ));
      });
      refs.tight.hidden = !(picked && Lib.isTight(f.people, nights));

      refs.arrivals.textContent = '';
      ARRIVALS.forEach(function (lbl) {
        append(refs.arrivals, h('button', { type: 'button', class: 'seg', 'aria-pressed': f.arrival === lbl ? 'true' : 'false', onclick: function () { set('arrival', lbl); } }, lbl));
      });
      refs.pays.textContent = '';
      PAYS.forEach(function (lbl) {
        append(refs.pays, h('button', { type: 'button', class: 'seg', 'aria-pressed': f.payment === lbl ? 'true' : 'false', onclick: function () { set('payment', lbl); } }, lbl));
      });

      var price = Lib.toInt(f.price);
      var stay = okDates ? price * nights : 0;
      var tax = okDates ? f.people * nights * TAX_PER_NIGHT : 0;
      refs.stay.textContent = price > 0 && okDates ? yen(stay) : '—';
      refs.tax.textContent = okDates ? f.people + '名×' + nights + '泊＝' + yen(tax) : '—';

      refs.meals.textContent = '';
      append(refs.meals,
        h('span', { class: 'lbl' }, '食事'),
        h('button', { type: 'button', class: 'seg', 'aria-pressed': f.breakfast ? 'true' : 'false', onclick: function () { set('breakfast', !f.breakfast); } }, '朝食'),
        h('button', { type: 'button', class: 'seg', 'aria-pressed': f.dinner ? 'true' : 'false', onclick: function () { set('dinner', !f.dinner); } }, '夕食'));

      var meals = [f.breakfast ? '朝食' : '', f.dinner ? '夕食' : ''].filter(Boolean);
      var rows = [
        ['日程', okDates ? Lib.shortLabel(inIso) + ' → ' + Lib.shortLabel(outIso) + '・' + nights + '泊' : ''],
        ['人数', f.people + '名'],
        ['部屋', picked],
        ['ゲスト名', f.name.trim()],
        ['連絡先', f.contact.trim()],
        ['到着', f.arrival],
        ['宿泊料', price > 0 && okDates ? yen(stay) : '', true],
        ['入湯税の目安（別）', okDates ? yen(tax) : ''],
        ['支払い', f.payment],
        ['食事', meals.length ? meals.join('・') : '素泊まり']
      ];
      refs.summary.textContent = '';
      rows.forEach(function (r) {
        var empty = !r[1];
        append(refs.summary, h('div', null, h('dt', null, r[0]), h('dd', { class: empty && !r[2] ? 'missing' : '' }, empty ? (r[2] ? 'あとで' : '未入力') : r[1])));
      });

      var missing = [];
      if (!okDates) missing.push('日程');
      if (!picked) missing.push('部屋');
      if (!f.name.trim()) missing.push('ゲスト名');
      if (!f.contact.trim()) missing.push('連絡先');
      refs.left.textContent = missing.length ? 'あと：' + missing.join('・') : '';
      refs.left.hidden = !missing.length;
      refs.save.disabled = missing.length > 0 || state.saving;
      refs.save.textContent = state.saving ? '入れています…' : 'この内容で予約を入れる';
      f._picked = picked;
    }
    state.updateForm = update;
    update();
  }

  function step(no, title, aside) {
    var children = Array.prototype.slice.call(arguments, 3);
    return h('section', { class: 'step', 'aria-labelledby': 'st' + no },
      h('div', { class: 'step-h' },
        h('span', { class: 'no', 'aria-hidden': 'true' }, String(no)),
        h('h2', { id: 'st' + no }, title),
        aside),
      children);
  }

  function save() {
    var f = state.form;
    if (state.saving || !f._picked) return;
    state.saving = true;
    state.updateForm();
    call('createBooking', {
      checkIn: f.checkIn, checkOut: f.checkOut, people: f.people, room: f._picked,
      name: f.name, contact: f.contact, arrival: f.arrival,
      price: f.price, payment: f.payment, breakfast: f.breakfast, dinner: f.dinner, memo: f.memo,
      inquiryId: f.inquiryId
    }).then(function (res) {
      state.saving = false;
      if (!res.ok) { toast(res.message, true); state.updateForm(); return; }
      toast('入れた。予約番号 ' + res.no);
      state.weekStart = f.checkIn < state.board.today ? state.board.today : f.checkIn;
      state.form = null;
      state.view = 'cal';
      go('cal');
      load();
    });
  }

  go('cal');
  load();
})();
</script>
