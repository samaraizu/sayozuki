<style>
  :root {
    --bg: #0F1218;
    --panel: #181C25;
    --panel-2: #141821;
    --line: #262B37;
    --line-2: #2C3240;
    --grid: #1F2430;
    --text: #ECE9E1;
    --muted: #A4A9B6;
    --faint: #8A90A0;
    --accent: #7CC4FF;
    --accent-soft: #B9E0FF;
    --on-accent: #0B1A2A;
    --red: #FF6B6B;
    --red-soft: #FFB4B4;
    /* 色は青と赤の2つだけ。青＝直販・押せるもの・選んだもの、赤＝問題。ほかはグレーの濃淡で分ける */
    --airbnb: #D8D4CA;
    --rakuten-line: #8A90A0;
    --direct: var(--accent);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: 'Zen Kaku Gothic New', system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
  button, input, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .shell { min-height: 100vh; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 28px; padding: 14px 16px 6px; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .logo { font-family: 'Shippori Mincho', serif; font-size: 21px; font-weight: 700; letter-spacing: 0.08em; }
  .sub { font-size: 12px; color: var(--muted); }
  .topnav { display: none; gap: 4px; }
  .topnav a { height: 40px; padding: 0 14px; border-radius: 10px; color: var(--text); text-decoration: none; display: flex; align-items: center; font-size: 14px; }
  .topnav a[aria-current="page"] { background: #222733; color: var(--accent); font-weight: 700; }
  .view { flex: 1; width: 100%; max-width: 1440px; margin: 0 auto; padding-bottom: 96px; }
  .loading, .fail { padding: 24px 16px; color: var(--muted); }
  .fail { color: var(--red-soft); }

  .bottomnav { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(2, 1fr); border-top: 1px solid var(--line); background: #131720; padding: 6px 4px calc(8px + env(safe-area-inset-bottom)); z-index: 5; }
  .bottomnav a { min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); text-decoration: none; font-size: 11px; }
  .bottomnav a[aria-current="page"] { color: var(--accent); font-weight: 700; }
  @media (min-width: 900px) {
    .top { padding: 14px 24px; border-bottom: 1px solid var(--line); }
    .topnav { display: flex; }
    .bottomnav { display: none; }
    .view { padding-bottom: 40px; }
  }

  /* ---------- カレンダー ---------- */
  .cal-head { padding: 8px 16px 4px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 8px; }
  .cal-head h1 { margin: 0; font-size: 16px; font-weight: 700; white-space: nowrap; }
  .pager { display: flex; align-items: center; gap: 2px; margin-left: auto; }
  .icon-btn { width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .icon-btn:hover { background: var(--panel); }
  .pill { height: 36px; padding: 0 12px; white-space: nowrap; border: 1px solid var(--line-2); border-radius: 999px; background: var(--panel); font-size: 13px; cursor: pointer; }

  .alert { margin: 6px 16px 0; display: flex; align-items: center; gap: 12px; width: calc(100% - 32px); padding: 12px 14px; border-radius: 12px; background: #3A1A1F; border: 1px solid var(--red); color: #FFD2D2; text-align: left; cursor: pointer; }
  .alert strong { display: block; font-size: 14px; color: #fff; }
  .alert span.s { display: block; font-size: 12px; color: #FFC2C2; }
  .alert .grow { flex: 1; }

  .status { padding: 12px 16px 6px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; font-size: 12px; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; background: var(--accent); }
  .need { margin-left: auto; padding: 3px 9px; border-radius: 999px; border: 1px dashed #FF8A8A; color: var(--red-soft); }
  .legend { padding: 4px 16px 10px; display: flex; flex-wrap: wrap; gap: 14px; font-size: 11px; color: var(--muted); }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .sw { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .sw.airbnb { background: var(--airbnb); }
  .sw.rakuten { box-shadow: inset 0 0 0 1.5px var(--rakuten-line); }
  .sw.direct { background: var(--direct); }
  .sw.prep { background: repeating-linear-gradient(135deg, #2A2F3B 0 3px, #171B24 3px 6px); border: 1px solid var(--line-2); }

  /* 4週間は画面に収まらないので横スクロール。部屋の列は左に貼り付けておく */
  .grid-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
  .grid { --cols: 28; min-width: calc(54px + var(--cols) * 44px); }
  .grow-row { display: grid; grid-template-columns: 54px repeat(var(--cols), minmax(44px, 1fr)); border-bottom: 1px solid var(--line); }
  .days { border-top: 1px solid var(--line); background: var(--panel-2); }
  .days .corner { padding: 0 0 6px 12px; font-size: 11px; color: var(--faint); align-self: end; position: sticky; left: 0; z-index: 3; background: var(--panel-2); align-self: stretch; display: flex; align-items: flex-end; }
  .day.wk, .slot.wk { border-left: 1px solid var(--line-2); }
  .day { padding: 6px 0 5px; display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .day .wd { font-size: 10px; color: var(--muted); }
  .day .dn { font-size: 15px; font-weight: 700; }
  .day.sat .wd, .day.sun .wd { color: var(--text); font-weight: 700; }
  .day.today { background: rgba(124, 196, 255, 0.12); border-top: 2px solid var(--accent); margin-top: -1px; }
  .day.today .wd, .day.today .dn { color: var(--accent); }
  .roomcell { grid-column: 1; padding: 10px 0 0 12px; display: flex; flex-direction: column; gap: 1px; position: sticky; left: 0; z-index: 2; background: var(--bg); }
  .roomcell .rn { font-size: 14px; font-weight: 700; }
  .roomcell .rc { font-size: 10px; color: var(--faint); }
  .roomcell .rx { margin-top: 6px; font-size: 10px; font-weight: 700; color: #FF8A8A; }
  .slot { border: 0; border-left: 1px solid var(--grid); background: transparent; padding: 0; cursor: pointer; min-height: 44px; }
  .slot:hover { background: rgba(255, 255, 255, 0.04); }
  .slot.today { background: rgba(124, 196, 255, 0.07); }
  .slot.clash { background: rgba(255, 107, 107, 0.10); box-shadow: inset 0 0 0 2px var(--red); border-radius: 8px; }
  .bar { position: relative; z-index: 1; align-self: center; height: 44px; margin: 0 2px; padding: 0 6px; border: 0; border-radius: 7px; text-align: left; display: flex; flex-direction: column; justify-content: center; overflow: hidden; cursor: pointer; min-width: 0; }
  .bar.clip-s { border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: 0; }
  .bar.clip-e { border-top-right-radius: 0; border-bottom-right-radius: 0; margin-right: 0; }
  .bar .bn { font-size: 11.5px; font-weight: 700; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .bs { font-size: 10px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 3px; }
  .bar.airbnb { background: var(--airbnb); color: #15181F; }
  .bar.airbnb .bs { color: #3A3F4B; }
  .bar.rakuten { background: var(--panel); box-shadow: inset 0 0 0 1.5px var(--rakuten-line); color: var(--text); }
  .bar.rakuten .bs { color: var(--muted); }
  .bar.direct { background: var(--direct); color: var(--on-accent); }
  .bar.direct .bs { color: #24405C; }
  .bar.need-input { outline: 2px dashed var(--red); outline-offset: -2px; }
  .bar.need-input .bs { color: #9E1C1C; font-weight: 700; }
  .bar.rakuten.need-input .bs { color: var(--red-soft); }
  .prep { grid-column: 2 / -1; margin: 6px 6px 6px 2px; border-radius: 7px; background: repeating-linear-gradient(135deg, #20242E 0 6px, #161A22 6px 12px); display: flex; align-items: center; padding-left: 10px; font-size: 11px; color: var(--muted); }
  .grow-row.off .rn { color: var(--faint); }

  .todaycards { padding: 14px 16px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .card { padding: 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; text-align: left; }
  .card .k { font-size: 11px; color: var(--muted); }
  .card .v { font-size: 15px; font-weight: 700; }
  .card .m { font-size: 12px; color: var(--muted); }
  .card button { all: unset; cursor: pointer; display: block; }

  /* ---------- 予約の中身 ---------- */
  .detail { width: min(480px, calc(100% - 24px)); max-height: calc(100% - 48px); padding: 0; border: 1px solid var(--line-2); border-radius: 16px; background: var(--panel); color: var(--text); }
  .detail::backdrop { background: rgba(5, 7, 10, 0.7); }
  .detail .dh { display: flex; align-items: center; gap: 10px; padding: 16px 16px 8px; }
  .detail h2 { margin: 0; font-size: 18px; flex: 1; overflow-wrap: anywhere; }
  .detail dl { margin: 0; padding: 0 16px 16px; }
  .detail dl div { min-height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
  .detail dt { font-size: 13px; color: var(--muted); flex: none; }
  .detail dd { margin: 0; font-size: 14px; font-weight: 700; text-align: right; overflow-wrap: anywhere; }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .chip.airbnb { background: var(--airbnb); color: #15181F; }
  .chip.rakuten { box-shadow: inset 0 0 0 1.5px var(--rakuten-line); color: var(--text); }
  .chip.direct { background: var(--direct); color: var(--on-accent); }

  /* ---------- 手動入力 ---------- */
  .form-wrap { padding: 16px; display: flex; flex-wrap: wrap; gap: 24px; }
  .form-main { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .form-side { flex: 1 1 340px; display: flex; flex-direction: column; gap: 14px; }
  @media (min-width: 900px) { .form-wrap { padding: 24px; } .form-side { position: sticky; top: 16px; align-self: flex-start; } }
  .form-main h1 { margin: 0; font-size: 24px; }
  .lead { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
  .step { padding: 20px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 16px; }
  .step-h { display: flex; align-items: center; gap: 10px; }
  .step-h .no { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .step-h h2 { margin: 0; font-size: 17px; }
  .step-h .aside { margin-left: auto; font-size: 13px; color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
  .field { flex: 1 1 200px; display: flex; flex-direction: column; gap: 6px; }
  .field label, .lbl { font-size: 13px; font-weight: 500; }
  .input { height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--bg); font-size: 16px; width: 100%; color-scheme: dark; }
  textarea.input { height: auto; padding: 12px 14px; resize: vertical; }
  .input:focus, .rcard:focus-visible, .seg:focus-visible, .icon-btn:focus-visible, .bar:focus-visible, .slot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button { width: 48px; height: 48px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--bg); font-size: 20px; cursor: pointer; }
  .stepper button:disabled { opacity: 0.4; cursor: not-allowed; }
  .stepper output { min-width: 56px; text-align: center; font-size: 20px; font-weight: 700; }
  .note { margin: 0; font-size: 14px; color: var(--muted); }
  .note.bad { color: var(--red-soft); }
  .rooms { display: flex; flex-wrap: wrap; gap: 10px; }
  .rcard { flex: 1 1 160px; min-height: 96px; padding: 12px 14px; border-radius: 12px; text-align: left; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; border: 1px solid #3A4152; background: #12161E; cursor: pointer; }
  .rcard .top-line { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; width: 100%; }
  .rcard .rid { font-size: 19px; font-weight: 700; }
  .rcard .cap { font-size: 12px; color: var(--faint); }
  .rcard .st { font-size: 13px; font-weight: 700; }
  .rcard .why { font-size: 12px; color: var(--faint); }
  .rcard[aria-pressed="true"] { border: 2px solid var(--accent); background: #142638; color: var(--accent-soft); }
  .rcard:disabled { border-style: dashed; border-color: var(--line-2); background: var(--panel-2); color: var(--faint); cursor: not-allowed; }
  .rcard.off:disabled { background: repeating-linear-gradient(135deg, #1A1E27 0 6px, #141821 6px 12px); }
  .warnbox { display: flex; gap: 10px; padding: 12px 14px; border-radius: 10px; background: #142638; color: var(--accent-soft); font-size: 14px; line-height: 1.5; }
  .segs { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg { height: 44px; padding: 0 16px; border-radius: 9px; border: 1px solid var(--line-2); background: transparent; font-size: 14px; cursor: pointer; }
  .seg[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 700; }
  fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
  legend { padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 500; }
  .totals { display: flex; flex-wrap: wrap; gap: 10px; }
  .total { flex: 1 1 160px; padding: 12px 14px; border-radius: 10px; background: var(--panel-2); display: flex; flex-direction: column; gap: 2px; }
  .total .k { font-size: 12px; color: var(--faint); }
  .total .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .meals { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
  .summary { padding: 22px; border-radius: 16px; background: #131C27; display: flex; flex-direction: column; gap: 12px; }
  .summary h2 { margin: 0; font-size: 17px; color: var(--accent-soft); }
  .summary dl { margin: 0; }
  .summary dl div { min-height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #223040; }
  .summary dt { font-size: 13px; color: var(--muted); flex: none; }
  .summary dd { margin: 0; font-size: 15px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; color: #EAF3FB; overflow-wrap: anywhere; }
  .summary dd.missing { color: var(--accent); }
  .savebox { padding: 18px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
  .savebox p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; }
  .savebox p.left { font-size: 14px; color: var(--red-soft); }
  .save { width: 100%; height: 56px; border-radius: 12px; border: 0; background: var(--accent); color: var(--on-accent); font-size: 17px; font-weight: 700; cursor: pointer; }
  .save:disabled { background: var(--line-2); color: var(--faint); cursor: not-allowed; }

  .toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: calc(100% - 32px); padding: 12px 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--accent); color: var(--text); font-size: 14px; z-index: 10; }
  .toast.bad { background: #3A1A1F; border-color: var(--red); color: #FFD2D2; }
  @media (min-width: 900px) { .toast { bottom: 24px; } }
</style>
